# Xcode project configuration. Managed by https://github.com/yonaskolb/XcodeGen
# Xcode is only used to build the release App Bundle. Debug builds only use Swift Package Manager

name: AeroSpace

packages:
  AeroSpacePackage:
    path: aerospace-package-symlink

configs:
  Debug: debug
  Release: release

# https://developer.apple.com/documentation/xcode/build-settings-reference
settings:
  base:
    ARCHS: arm64
    TOOLCHAINS: ${XCODEGEN_TOOLCHAINS}
    SWIFT_VERSION: ${XCODEGEN_SWIFT_VERSION}
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.0.0-SNAPSHOT
    # https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/LaunchServicesKeys.html#//apple_ref/doc/uid/20001431-108256
    # Specifies whether the app runs as an agent app. If this key is set to YES, Launch Services runs the app as an agent app.
    # Agent apps do not appear in the Dock or in the Force Quit window (cmd-opt-esc)
    INFOPLIST_KEY_LSUIElement: YES
    AEROSPACE_CODE_SIGN_IDENTITY: aerospace-codesign-certificate
    CODE_SIGN_IDENTITY: $(AEROSPACE_CODE_SIGN_IDENTITY)

targets:
  AeroSpaceCli:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - "../Sources/Cli"
    dependencies:
      - package: AeroSpacePackage
        product: Common
    settings:
      base:
        PRODUCT_NAME: aerospace
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
      configs:
        Release:
          OTHER_LDFLAGS: $(inherited) $(AEROSPACE_BUILD_INFO_LDFLAGS)

  AeroSpace:
    type: application
    platform: macOS
    deploymentTarget: ${XCODEGEN_DEPLOYMENT_TARGET}
    sources:
      - "../Sources/AeroSpaceApp"
      - "../resources"
      - "../docs/config-examples/default-config.toml"
    dependencies:
      - package: AeroSpacePackage
        product: AppBundle
    info:
      path: AeroSpace-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        SUFeedURL: https://github.com/quanganhdo/Aerospace/releases/latest/download/appcast.xml
        SUPublicEDKey: ${XCODEGEN_SPARKLE_PUBLIC_ED_KEY}
        SUVerifyUpdateBeforeExtraction: true
    # https://developer.apple.com/documentation/xcode/build-settings-reference
    settings:
      base:
        CURRENT_PROJECT_VERSION: ${XCODEGEN_AEROSPACE_BUILD_NUMBER}
      configs:
        Debug:
          PRODUCT_NAME: AeroSpace-Debug
          PRODUCT_BUNDLE_IDENTIFIER: do.anh.Aerospace.debug
        Release:
          PRODUCT_NAME: AeroSpace
          PRODUCT_BUNDLE_IDENTIFIER: do.anh.Aerospace
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
          GCC_TREAT_WARNINGS_AS_ERRORS: YES
          OTHER_LDFLAGS: $(inherited) $(AEROSPACE_BUILD_INFO_LDFLAGS)
    entitlements:
      path: ../resources/AeroSpace.entitlements
      properties:
        # Accessibility API doesn't work in sandboxed apps
        com.apple.security.app-sandbox: false
